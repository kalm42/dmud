<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>dmud</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--vellum); color:var(--ink); font-family:var(--font-serif); overflow:hidden; }
  .cover { position:relative; width:960px; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .deep { fill:var(--vellum-deep); }
  .walnut { fill:var(--walnut); }
  .amber { fill:var(--amber); }
  .gilt { fill:none; stroke:var(--gilt); stroke-width:1.25; }
  .star { fill:var(--gilt); font-size:18px; font-family:var(--font-serif); }
  .initial { fill:var(--amber); font-family:var(--font-initial); font-weight:700; font-size:208px; }
  .words { position:absolute; left:var(--space-6); bottom:var(--space-6); max-width:440px; }
  .name { margin:0; font-family:var(--font-display); font-size:112px; line-height:.92; font-weight:700; letter-spacing:.02em; color:var(--ink); }
  .tag { margin:var(--space-3) 0 0 4px; font-family:var(--font-serif); font-style:italic; font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      vellum-deep 200x208 initial plate · walnut 136x304 binding bled top and bottom · amber 112x208 bled right — ≈40% of 960x288
  arrangement an illuminated plate beside a leather binding, an amber leaf beside it; bottoms of plate and leaf on one line
  pattern     one oversized glyph clipped by a block, from the drop-cap initial (Cinzel Decorative, the system's display face); gilt double frames on plate and binding, two ✦ page stars
  scales      sides in space-2 multiples; gutters space-4; frame insets space-1/space-2; corners radius-sm (4) and radius-md (6)
-->
<rect class="deep" x="16" y="40" width="200" height="208" rx="4"/>
<rect class="gilt" x="20" y="44" width="192" height="200" rx="3"/>
<rect class="gilt" x="24" y="48" width="184" height="192" rx="2"/>
<text class="initial" x="116" y="226" text-anchor="middle">D</text>
<rect class="walnut" x="232" y="-8" width="136" height="304" rx="6"/>
<rect class="gilt" x="240" y="8" width="120" height="272" rx="3"/>
<rect class="gilt" x="244" y="12" width="112" height="264" rx="2"/>
<text class="star" x="300" y="150" text-anchor="middle">✦</text>
<rect class="amber" x="384" y="40" width="112" height="208" rx="6"/>
<text class="star" x="432" y="28" text-anchor="middle">✦</text>
</svg>
</div>
<div class="words">
<p class="name">dmud</p>
<p class="tag">An illuminated campaign book for one player and Rowan, their Dungeon Master.</p>
</div>
</div>
</body>
</html>
