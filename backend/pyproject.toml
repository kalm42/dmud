[project]
name = "backend"
version = "0.1.0"
description = "Local authoritative dmud API"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]==0.141.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
    "pyright==1.1.411",
    "pytest==9.1.1",
    "ruff==0.16.6",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.pyright]
include = ["src", "scripts"]
extraPaths = ["src"]
typeCheckingMode = "strict"

[tool.ruff]
target-version = "py314"
