kind: location
id: location:brackenford:market-square
name: Market Square
introduction: >-
  Market Square is the cobbled heart of Brackenford, a broad open space ringed
  by timber-fronted houses whose upper storeys lean toward one another. A stone
  well with a worn oak cover stands near the centre, and the paving around it is
  damp and scuffed by cart wheels. Canvas awnings and hand-painted signs crowd
  the edges of the square, and the smells of bread, wet straw, and wood smoke
  drift on the air. A short lane leads to Mara's Stall, and a longer street runs
  downhill toward the Common Room.
exits:
